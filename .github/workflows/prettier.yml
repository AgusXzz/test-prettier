name: Prettier Auto Fix

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Prettier
        run: npm install --no-save prettier

      - name: Format files
        run: npx prettier --write .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "style: format code with Prettier"
          title: "style: format code with Prettier"
          body: |
            ## Automatic formatting

            This PR was created automatically by GitHub Actions after running Prettier.
          branch: chore/prettier-auto-format
          delete-branch: true
          labels: |
            formatting
            automated
